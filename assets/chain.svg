<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">GhostLock execution chain</title>
  <desc id="desc">Monochrome five-stage execution chain from CVE-2026-43499 to a working KernelSU late-load.</desc>

  <rect width="1600" height="520" fill="#070707"/>
  <rect x="44" y="44" width="1512" height="432" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <path d="M80 88H1520" stroke="#ffffff" stroke-opacity="0.16"/>
  <path d="M80 176H1520" stroke="#ffffff" stroke-opacity="0.16"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="80" y="70" fill="#8d8d8d" font-size="11" letter-spacing="2.8">EXECUTION CHAIN / VERIFIED</text>
    <text x="1520" y="70" fill="#8d8d8d" font-size="10" text-anchor="end" letter-spacing="2">MAGICOS 8.0.0.191 / ANDROID 14 / LINUX 5.10.252</text>
  </g>

  <g font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
    <text x="80" y="132" fill="#f2f2f2" font-size="34" font-weight="700" letter-spacing="-0.7">From UAF to KernelSU.</text>
    <text x="80" y="157" fill="#8d8d8d" font-size="14">Five stages. One boot. Everything after the trigger stays in memory.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <path d="M80 212H1520" stroke="#ffffff" stroke-opacity="0.16"/>
    <path d="M80 402H1520" stroke="#ffffff" stroke-opacity="0.16"/>

    <text x="80" y="250" fill="#6f6f6f" font-size="11" letter-spacing="2">01</text>
    <text x="80" y="284" fill="#f2f2f2" font-size="18" font-weight="700">CVE-2026-43499</text>
    <text x="80" y="312" fill="#a6a6a6" font-size="12">rtmutex UAF</text>
    <text x="80" y="336" fill="#6f6f6f" font-size="11">trigger rollback path</text>
    <text x="80" y="380" fill="#8d8d8d" font-size="10" letter-spacing="1.4">TRIGGERED</text>

    <path d="M356 212V402" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="388" y="250" fill="#6f6f6f" font-size="11" letter-spacing="2">02</text>
    <text x="388" y="284" fill="#f2f2f2" font-size="18" font-weight="700">kernel-domain root</text>
    <text x="388" y="312" fill="#a6a6a6" font-size="12">boot_id r/w</text>
    <text x="388" y="336" fill="#6f6f6f" font-size="11">temporary kernel access</text>
    <text x="388" y="380" fill="#8d8d8d" font-size="10" letter-spacing="1.4">TEMPORARY</text>

    <path d="M664 212V402" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="696" y="250" fill="#6f6f6f" font-size="11" letter-spacing="2">03</text>
    <text x="696" y="284" fill="#f2f2f2" font-size="18" font-weight="700">208 / 208</text>
    <text x="696" y="312" fill="#a6a6a6" font-size="12">fake kallsyms</text>
    <text x="696" y="336" fill="#6f6f6f" font-size="11">hidden symbols restored</text>
    <text x="696" y="380" fill="#8d8d8d" font-size="10" letter-spacing="1.4">RESOLVED</text>

    <path d="M972 212V402" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1004" y="250" fill="#6f6f6f" font-size="11" letter-spacing="2">04</text>
    <text x="1004" y="284" fill="#f2f2f2" font-size="18" font-weight="700">KernelSU LKM</text>
    <text x="1004" y="312" fill="#a6a6a6" font-size="12">init_module(flags=0)</text>
    <text x="1004" y="336" fill="#6f6f6f" font-size="11">SHN_ABS relocation</text>
    <text x="1004" y="380" fill="#8d8d8d" font-size="10" letter-spacing="1.4">LOADED</text>

    <path d="M1280 212V402" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1312" y="250" fill="#6f6f6f" font-size="11" letter-spacing="2">05</text>
    <text x="1312" y="284" fill="#f2f2f2" font-size="18" font-weight="700">KernelSU working</text>
    <text x="1312" y="312" fill="#a6a6a6" font-size="12">LKM · 32601-2</text>
    <text x="1312" y="336" fill="#6f6f6f" font-size="11">ksud + Manager</text>
    <text x="1312" y="380" fill="#8d8d8d" font-size="10" letter-spacing="1.4">VERIFIED</text>
  </g>

  <g fill="none" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M326 292H342"/>
    <path d="M336 286L342 292L336 298"/>
    <path d="M634 292H650"/>
    <path d="M644 286L650 292L644 298"/>
    <path d="M942 292H958"/>
    <path d="M952 286L958 292L952 298"/>
    <path d="M1250 292H1266"/>
    <path d="M1260 286L1266 292L1260 298"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2">
    <text x="80" y="435" fill="#8d8d8d">IN-MEMORY ONLY</text>
    <text x="800" y="435" fill="#8d8d8d" text-anchor="middle">NO BOOT / SUPER / VBMETA WRITES</text>
    <text x="1520" y="435" fill="#a6a6a6" text-anchor="end">REBOOT REMOVES MODULE, su &amp; MANAGER STATE</text>
    <text x="80" y="461" fill="#555555" font-size="9.5">SELINUX: PERMISSIVE IN THE VERIFIED RUN · ENFORCE=1 NOT INDEPENDENTLY REGRESSION-TESTED</text>
    <text x="1520" y="461" fill="#555555" font-size="9.5" text-anchor="end">THIRD-PARTY KSU MODULES: NOT VALIDATED</text>
  </g>
</svg>
